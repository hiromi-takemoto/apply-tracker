# デモ環境の延命（受注活動を休止している間、公開URLを死なせないため）
#
# Supabase の無料プランは、一定期間アクセスが無いとプロジェクトが自動で一時停止する。
# 停止すると apply-tracker-self.vercel.app のログインが通らなくなり、
# 「リンクは生きているのに中身が死んでいる」一番まずい状態になる。
# 週2回、実際にDBへ問い合わせて「使われている」状態を保つ。
#
# 注意: GitHubは「リポジトリが60日間無活動」だとスケジュール実行を自動で止める
#       （事前にオーナーへメールが届く。メール内のボタンか、何かコミットすれば再開する）。
#       これを避けるためにボット用の空コミットを積むことはしない。
#       ポートフォリオとして人に読ませる履歴を汚すほうが損失が大きいため。

name: Keepalive

on:
  schedule:
    - cron: "0 3 * * 1,4" # 毎週 月・木 の 03:00 UTC（12:00 JST）。最大間隔4日
  workflow_dispatch: # 手動でも実行できる

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Supabase に問い合わせる（DBアクセスを発生させる）
        env:
          SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "::error::NEXT_PUBLIC_SUPABASE_URL / NEXT_PUBLIC_SUPABASE_ANON_KEY が未設定です。" \
                 "設定しないとデモ環境の延命ができません。"
            exit 1
          fi
          # RLSにより anon では他人の行は返らない（空配列が返る）。
          # 中身は問題ではなく、DBへ実際にクエリが飛ぶことが目的。
          code=$(curl -sS -o /dev/null -w '%{http_code}' \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
            "$SUPABASE_URL/rest/v1/applications?select=id&limit=1")
          echo "Supabase REST: HTTP $code"
          # 200 = 生きている。それ以外は一時停止・キー失効などの可能性があるので失敗させる
          if [ "$code" != "200" ]; then
            echo "::error::Supabase が想定外の応答を返しました (HTTP $code)。" \
                 "プロジェクトが一時停止しているか、キーが失効している可能性があります。"
            exit 1
          fi

      - name: 公開URLが表示できるか確認する
        run: |
          code=$(curl -sS -o /dev/null -w '%{http_code}' -L \
            https://apply-tracker-self.vercel.app/login)
          echo "Vercel /login: HTTP $code"
          if [ "$code" != "200" ]; then
            echo "::error::公開URLが HTTP $code を返しました。デモが見られない状態です。"
            exit 1
          fi
